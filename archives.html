<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="icon" type="image/png" href="snu.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNUTI log : Archives</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="style.css" /> 
    <style>
        .search-filter-wrapper { background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); margin-bottom: 40px; display: flex; flex-direction: column; gap: 20px; align-items: center; }
        
        /* 검색창 & 연도 필터 레이아웃 */
        .search-controls { display: flex; gap: 15px; width: 100%; max-width: 700px; }
        .search-controls input { flex: 2; padding: 15px 20px; border: 2px solid #edf2f7; border-radius: 50px; font-size: 1rem; transition: 0.3s; outline: none; }
        .search-controls input:focus { border-color: var(--log-color); box-shadow: 0 0 10px rgba(0, 180, 197, 0.1); }
        .search-controls select { flex: 1; padding: 0 20px; border: 2px solid #edf2f7; border-radius: 50px; font-size: 1rem; outline: none; cursor: pointer; background: white; font-weight: bold; color: var(--snuti-blue); transition: 0.3s;}
        .search-controls select:focus { border-color: var(--log-color); }

        @media (max-width: 768px) {
            .search-filter-wrapper { padding: 20px; }
            .search-controls { flex-direction: column; gap: 10px; }
            .search-controls select { padding: 15px 20px; }
            .slogan-text { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">SNUTI <span class="log">log</span></a>
        <nav>
            <ul>
                <li><a href="about.html">About</a></li>
                <li><a href="archives.html" style="color: var(--log-color);">Archives</a></li>
                <li><a href="method.html">How to Log</a></li>
                <li><a href="write.html">Log Now</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section id="archives">
        <div class="section-header">
            <h2>Archive Logs</h2>
        </div>
        
        <div class="search-filter-wrapper">
            <div class="search-controls">
                <select id="year-filter" onchange="handleSearch()">
                    <option value="All">전체 연도</option>
                    <option value="2026">2026년</option>
                </select>
                <input type="text" id="search-input" placeholder="제목 또는 작성자를 입력하여 검색하세요..." oninput="handleSearch()">
            </div>
            
            <div class="slogan-filter-container" style="margin-bottom: 0; padding: 10px 0; background: none;">
                <h2 class="slogan-text" style="font-size: 2rem;">
                    <span class="filter-word" data-tag="함께">함께</span> 빚어낼 자유로운 
                    <span class="filter-word" data-tag="꿈">꿈</span>,<br class="mobile-break">
                    <span class="filter-word" data-tag="미래">미래</span>를 여는 담대한 
                    <span class="filter-word" data-tag="도전">도전</span>
                </h2>
            </div>
        </div>

        <div class="post-list-container" id="post-container"></div>
    </section>

    <div class="modal-overlay" id="post-modal">
        <div class="modal-content">
            <div class="modal-header">
                <button class="btn-close" onclick="closeModal('post-modal')">&times;</button>
                <span class="modal-tag" id="m-tag">TAG</span>
                <h2 class="modal-title" id="m-title">제목</h2>
                <p class="modal-info" id="m-info">작성자 | 날짜</p>
                <button class="btn-share" onclick="sharePost()">🔗 이 이야기 공유하기</button>
            </div>
            <div class="modal-body" id="m-body">내용</div>
        </div>
    </div>

    <footer>
        <strong>SNUTI log</strong>
        <p>서울대학교 첨단융합학부 학생 활동 아카이빙 커뮤니티</p>
        <p style="margin-top: 15px;">
            <a href="https://forms.gle/yWQmUZpCn2wwuDDW7" target="_blank" rel="noopener noreferrer" style="color: var(--snuti-mint); font-weight: 700; text-decoration: underline;">
                💡 시범 운영 피드백 및 오류 제보하기
            </a>
        </p>
        <p style="margin-top: 10px;">&copy; 2026 SNUTI log. All rights reserved.</p>
    </footer>

    <script src="data.js"></script>
    
    <script>
        const container = document.getElementById('post-container');
        const filterWords = document.querySelectorAll('.filter-word');
        const searchInput = document.getElementById('search-input');
        const yearFilter = document.getElementById('year-filter');
    
        let currentFilterTag = 'All';
    
        // postData는 위에서 불러온 data.js에서 이미 선언되었으므로 여기서 다시 선언하지 않습니다.
        // 기존의 const postData = ... 코드는 삭제합니다.
    
        renderPosts();

        // 키워드 필터링 이벤트 (슬로건)
        filterWords.forEach(word => {
            word.addEventListener('click', () => {
                const isActive = word.classList.contains('active');
                filterWords.forEach(w => w.classList.remove('active'));
                if (!isActive) {
                    word.classList.add('active');
                    currentFilterTag = word.getAttribute('data-tag');
                } else {
                    currentFilterTag = 'All';
                }
                renderPosts();
            });
        });

        // 다중 조건 필터링 렌더링 함수
        function renderPosts() {
            container.innerHTML = ''; 
            const keyword = searchInput.value.toLowerCase().trim();
            const selectedYear = yearFilter.value;

            // 1. 태그 필터링
            let filteredData = currentFilterTag === 'All' 
                ? postData 
                : postData.filter(post => post.tag === currentFilterTag);

            // 2. 연도 필터링
            if (selectedYear !== 'All') {
                filteredData = filteredData.filter(post => post.date.startsWith(selectedYear));
            }

            // 3. 검색어 필터링
            if (keyword !== '') {
                filteredData = filteredData.filter(post => 
                    post.title.toLowerCase().includes(keyword) || 
                    post.author.toLowerCase().includes(keyword)
                );
            }

            if (filteredData.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #999; padding: 40px 0;">조건에 일치하는 기록이 없습니다.</p>';
                return;
            }

            filteredData.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => openReadModal(post); 
                card.innerHTML = `
                    <span class="post-tag-badge" style="color:${getTagColor(post.tag)}">${post.tag}</span>
                    <div class="post-content">
                        <h3 class="post-title">${post.title}</h3>
                        <p class="post-desc">${post.desc}</p>
                        <div class="post-meta">
                            <span>${post.author}</span>
                            <span>${post.date}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function handleSearch() {
            renderPosts();
        }

        // 모달 윈도우 제어 (연락처 표시 추가)
        function openReadModal(post) {
            document.getElementById('m-tag').innerText = post.tag;
            document.getElementById('m-tag').style.color = getTagColor(post.tag);
            document.getElementById('m-title').innerText = post.title;
            // 작성자 정보 및 날짜 아래에 연락처 정보를 추가로 렌더링
            document.getElementById('m-info').innerHTML = `
                ${post.author} | ${post.date} 
                <br><span style="color: var(--log-color); font-weight: bold; margin-top: 5px; display: inline-block;">✉️ Contact: ${post.contact || '기재되지 않음'}</span>
            `;
            document.getElementById('m-body').innerText = post.content;
            
            document.getElementById('post-modal').classList.add('open');
            document.body.style.overflow = 'hidden'; 
        }

        function closeModal(targetModalId) {
            if(targetModalId) {
                document.getElementById(targetModalId).classList.remove('open');
            } else {
                document.querySelectorAll('.modal-overlay').forEach(modal => modal.classList.remove('open'));
            }
            document.body.style.overflow = 'auto';
        }

        document.querySelectorAll('.modal-overlay').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal(modal.id);
            });
        });

        function getTagColor(tag) {
            const colors = { '함께': '#FF6B6B', '꿈': '#FFB703', '미래': '#00B4C5', '도전': '#4D96FF' };
            return colors[tag] || '#555';
        }
    </script>
</body>
</html>
