<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="icon" type="image/png" href="snu.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNUTI log : Archives</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="style.css" /> 
    <style>
        /* Archives 페이지 전용 확장 스타일 */
        .search-filter-wrapper {
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .search-bar-container {
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        .search-bar-container input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #edf2f7;
            border-radius: 50px;
            font-size: 1rem;
            transition: 0.3s;
            outline: none;
        }

        .search-bar-container input:focus {
            border-color: var(--log-color);
            box-shadow: 0 0 10px rgba(0, 180, 197, 0.1);
        }

        @media (max-width: 768px) {
            .search-filter-wrapper { padding: 20px; }
            .slogan-text { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            SNUTI <span class="log">log</span>
        </a>
        <nav>
            <ul>
                <li><a href="about.html">About</a></li>
                <li><a href="method.html">How to Log</a></li>
                <li><a href="archives.html" style="color: var(--log-color);">Archives</a></li>
                <li><a href="write.html">Log Now</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section id="archives">
        <div class="section-header">
            <h2>Archive Logs</h2>
            <p>첨단융합학부 학생들의 도전과 성장 기록을 검색하고 필터링해 보세요.</p>
        </div>
        
        <div class="search-filter-wrapper">
            <div class="search-bar-container">
                <input type="text" id="search-input" placeholder="제목 또는 작성자를 입력하여 검색하세요..." oninput="handleSearch()">
            </div>
            
            <div class="slogan-filter-container" style="margin-bottom: 0; padding: 10px 0; background: none;">
                <h2 class="slogan-text" style="font-size: 2rem;">
                    <span class="filter-word" data-tag="함께">함께</span> 빚어낼 자유로운 
                    <span class="filter-word" data-tag="꿈">꿈</span>,<br class="mobile-break">
                    <span class="filter-word" data-tag="미래">미래</span>를 여는 담대한 
                    <span class="filter-word" data-tag="도전">도전</span>
                </h2>
            </div>
        </div>

        <div class="post-list-container" id="post-container"></div>
    </section>

    <div class="modal-overlay" id="post-modal">
        <div class="modal-content">
            <div class="modal-header">
                <button class="btn-close" onclick="closeModal('post-modal')">&times;</button>
                <span class="modal-tag" id="m-tag">TAG</span>
                <h2 class="modal-title" id="m-title">제목</h2>
                <p class="modal-info" id="m-info">작성자 | 날짜</p>
            </div>
            <div class="modal-body" id="m-body">내용</div>
        </div>
    </div>

    <footer>
        <strong>SNUTI log</strong>
        <p>서울대학교 첨단융합학부 학생 활동 아카이빙 커뮤니티</p>
        <p>&copy; 2026 SNUTI log. All rights reserved.</p>
    </footer>

    <script>
        const container = document.getElementById('post-container');
        const filterWords = document.querySelectorAll('.filter-word');
        const searchInput = document.getElementById('search-input');
        
        let currentFilterTag = 'All';

        // 데이터베이스 (정적 데이터)
        const postData = [
            {
                id: 1, tag: "도전", title: "부산 BEXCO 파이널 피칭 도전기", author: "25학번 창업팀", date: "2026-03-01",
                desc: "첨융 25학번 창업팀이 경진대회 우수 성적으로 최종 무대에 서기까지의 치열했던 준비 과정.",
                content: `이곳에 본문 내용을 입력하세요.`
            },
            {
                id: 2, tag: "함께", title: "관악구 어르신 대상 AI 교육 봉사", author: "socieTI", date: "2026-02-15",
                desc: "KTI 챌린지의 영감이 사회공헌으로. 어르신들과 함께한 따뜻한 디지털 교육 현장.",
                content: `이곳에 본문 내용을 입력하세요.`
            },
            {
                id: 3, tag: "꿈", title: "실리콘 밸리에서 관악까지: SNU Connect Community", author: "SNU Connect", date: "2026-01-20",
                desc: "24-25 하계 실리콘 밸리 연수 경험을 공유하며 형성된 선후배 커뮤니티 이야기.",
                content: `실리콘밸리라는 공유된 경험을 바탕으로 24학번, 25학번, 그리고 타학과 선배들이 모였습니다.
                
현지에서 느꼈던 혁신의 문화를 한국에 돌아와서도 이어가기 위해 매주 온라인 영감 공유회를 진행하고 있습니다. 박세원, 정윤지, 김은기, 이재규 멘토님과 함께하는 세션은 우리에게 늘 새로운 자극이 됩니다.
단순한 친목을 넘어 글로벌 리더로 성장하기 위한 발판이 되고 있습니다.`
            }
        ];

        // 초기 실행
        renderPosts();

        // 키워드 필터링 이벤트 매핑
        filterWords.forEach(word => {
            word.addEventListener('click', () => {
                const isActive = word.classList.contains('active');
                filterWords.forEach(w => w.classList.remove('active'));

                if (!isActive) {
                    word.classList.add('active');
                    currentFilterTag = word.getAttribute('data-tag');
                } else {
                    currentFilterTag = 'All';
                }
                renderPosts();
            });
        });

        // 통합 검색 및 렌더링 함수
        function renderPosts() {
            container.innerHTML = ''; 
            const keyword = searchInput.value.toLowerCase().trim();

            // 1차 필터링: 태그 기준
            let filteredData = currentFilterTag === 'All' 
                ? postData 
                : postData.filter(post => post.tag === currentFilterTag);

            // 2차 필터링: 검색어 기준 (제목 또는 작성자 검색)
            if (keyword !== '') {
                filteredData = filteredData.filter(post => 
                    post.title.toLowerCase().includes(keyword) || 
                    post.author.toLowerCase().includes(keyword)
                );
            }

            if (filteredData.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #999; padding: 40px 0;">조건에 일치하는 기록이 없습니다.</p>';
                return;
            }

            filteredData.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => openReadModal(post); 

                card.innerHTML = `
                    <span class="post-tag-badge" style="color:${getTagColor(post.tag)}">${post.tag}</span>
                    <div class="post-content">
                        <h3 class="post-title">${post.title}</h3>
                        <p class="post-desc">${post.desc}</p>
                        <div class="post-meta">
                            <span>${post.author}</span>
                            <span>${post.date}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function handleSearch() {
            renderPosts();
        }

        // 모달 윈도우 제어 로직
        function openReadModal(post) {
            document.getElementById('m-tag').innerText = post.tag;
            document.getElementById('m-tag').style.color = getTagColor(post.tag);
            document.getElementById('m-title').innerText = post.title;
            document.getElementById('m-info').innerText = `${post.author} | ${post.date}`;
            document.getElementById('m-body').innerText = post.content;
            
            document.getElementById('post-modal').classList.add('open');
            document.body.style.overflow = 'hidden'; 
        }

        function closeModal(targetModalId) {
            if(targetModalId) {
                document.getElementById(targetModalId).classList.remove('open');
            } else {
                document.querySelectorAll('.modal-overlay').forEach(modal => modal.classList.remove('open'));
            }
            document.body.style.overflow = 'auto';
        }

        document.querySelectorAll('.modal-overlay').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal(modal.id);
            });
        });

        function getTagColor(tag) {
            const colors = { '함께': '#FF6B6B', '꿈': '#FFB703', '미래': '#00B4C5', '도전': '#4D96FF' };
            return colors[tag] || '#555';
        }
    </script>
</body>
</html>
